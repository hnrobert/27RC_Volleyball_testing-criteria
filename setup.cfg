# =============================================================================
# Canonical Python formatting / lint config
# -----------------------------------------------------------------------------
# Rule: follow PEP 8, format with autopep8, sort imports with isort
# (line length 79).
# Usage:
#   Format:       autopep8 --in-place --recursive --max-line-length 79 .
#   Sort imports: isort .
#   Check:        flake8 .    or    autopep8 --diff .
# =============================================================================

[flake8]
max-line-length = 79
extend-ignore =
    E203,
    W503
exclude =
    .git,
    __pycache__,
    build,
    develop,
    install,
    dist,
    log,
    .venv,
    venv

[autopep8]
max_line_length = 79

[isort]
line_length = 79
